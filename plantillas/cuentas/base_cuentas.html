{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RentaSalas{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/teams.css' %}">
</head>
<body class="teams-app teams-auth-page">

<div class="teams-auth-layout">
    <a href="{% url 'inicio' %}" class="teams-auth-brand">
        <span class="teams-auth-brand__logo">RS</span>
        <span class="teams-auth-brand__name">RentaSalas</span>
    </a>

    {% if messages %}
    <div class="teams-auth-messages">
        {% for message in messages %}
        <div class="teams-alert teams-alert--{{ message.tags|default:'info' }}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="teams-auth-card">
        {% block content %}{% endblock %}
    </div>

    <p class="teams-auth-footer">
        <a href="{% url 'inicio' %}">← Volver al inicio</a>
    </p>
</div>

</body>
</html>
